server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # /templates/ holds JSON data files the app loads (template catalogues); the folder itself
    # is not a page. Without this block nginx answers /templates/ with 403 (a folder with no
    # index.html); with it, the folder and missing files are a plain 404 and the files still load.
    location /templates/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
