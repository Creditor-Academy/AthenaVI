server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Text responses are gzipped. Precompressed .gz files from the build are used when present.
    # The stock nginx image has no brotli module; the build also writes .br files for a proxy that can serve them.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/manifest+json;

    # Public http://virtualstudio.lmsathena.com/ is answered with 500 by the Pingora proxy
    # before the request reaches this container, so a redirect here would not fix that.
    # HSTS is forwarded by the TLS terminator on the HTTPS response. Do not 301 this
    # listener: the proxy talks to the container over HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Unknown URLs answer 404, with the app's Not Found page (dist/404.html is noindex).
    error_page 404 /404.html;
    # A folder with no page in it (/templates/, /assets/, …) is "not found", not "forbidden".
    error_page 403 =404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        gzip_static on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages the app builds on the fly (no file for them in dist): always the app.
    # Dashboard sections, the editors, shared decks (/p/, /share/), invitation and
    # password-reset links, and the Google sign-in callbacks.
    location ~ ^/(dashboard|slides|create|p|share|invitations|invite|reset-password|auth|oauth|login/callback)(/|$) {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    location ~ ^/(hub|products/choose)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Everything else: a file from the build, a page folder (dist/<page>/index.html), or 404.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
